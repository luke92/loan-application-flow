services:
  mock:
    build: ./mock-external-service
    ports:
      - "4000:4000"

  backend:
    build: ./backend
    ports:
      - "5080:5080"
    environment:
      - ConnectionStrings__Default=Data Source=/data/loan_applications.db
      - ExternalService__BaseUrl=http://mock:4000
    volumes:
      - backend-data:/data
    depends_on:
      - mock

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend-data:
